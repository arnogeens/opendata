name: Live cloud map

# Builds the global cloud map from EUMETSAT's 3-hourly composites and
# publishes it to the live-clouds branch, which always holds exactly one
# commit (force-pushed), so old maps never pile up in git history.
# EUMETSAT publishes a time step every 3 h (00, 03, ... UTC) about 40 min
# after the slot (09:00 appeared at 09:36-09:40 on 2026-11-09). One run per
# step plus one retry; a run with nothing new ends within seconds.

on:
  schedule:
    - cron: "50 */3 * * *"      # slot + 0:50
    - cron: "20 1-23/3 * * *"   # retry, slot + 1:20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-clouds
  cancel-in-progress: false

env:
  RAW: https://raw.githubusercontent.com/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only the script; never the (large) data tree.
      - name: Fetch the build script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/build_live_cloud_maps.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --quiet numpy pillow

      - name: Build cloud map
        id: build
        run: |
          python -u scripts/build_live_cloud_maps.py \
            --output-dir out \
            --static-base "$RAW/main/data/earth-textures/static" \
            --previous-manifest "$RAW/live-clouds/latest.json"

      - name: Publish to live-clouds (single commit)
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TIME: ${{ steps.build.outputs.source_time }}
        run: |
          set -euo pipefail
          cd out
          printf '%s\n' \
            "# Live cloud map" "" \
            "Global cloud cover, 8192x4096, rebuilt from EUMETSAT's 3-hourly composites." \
            "This branch is overwritten on every update; it never keeps old maps." "" \
            "Source time: ${SOURCE_TIME}" "" \
            "Contains modified EUMETSAT data." > README.md
          git init --quiet -b live-clouds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clouds.webp latest.json README.md
          git commit --quiet -m "clouds: ${SOURCE_TIME}"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live-clouds
